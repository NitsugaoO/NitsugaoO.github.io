<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>呜云 · 博客管理</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/preview/katex.min.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">呜云<span>· 管理</span></div>
    <nav class="views" id="views">
      <button type="button" data-view="posts" class="is-active">文章</button>
      <button type="button" data-view="shuoshuo">说说</button>
      <button type="button" data-view="lyrics">歌曲</button>
      <button type="button" data-view="images">图片</button>
      <button type="button" data-view="link">友链</button>
      <button type="button" data-view="about">关于</button>
      <button type="button" data-view="site">公告</button>
    </nav>
    <div class="actions">
      <button type="button" class="status" id="status" title="查看未发布的文件"></button>
      <a class="btn" href="https://nitsugaoo.github.io/" target="_blank" rel="noopener">GitHub Pages</a>
      <a class="btn" href="https://blog.wooyun.workers.dev/" target="_blank" rel="noopener">Cloudflare</a>
      <button type="button" class="btn" id="btn-refresh" title="重新从磁盘读取 md / yml 文件">重新读取</button>
      <button type="button" class="btn" id="btn-generate" title="运行 pnpm exec hexo generate">生成站点</button>
      <button type="button" class="btn primary" id="btn-save">保存</button>
      <button type="button" class="btn primary" id="btn-publish">发布</button>
    </div>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
