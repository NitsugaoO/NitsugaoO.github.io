# ============================================================================
# 侧栏自定义卡片
# ----------------------------------------------------------------------------
# Butterfly 会把这里的 top / bottom 渲染成侧栏卡片：
#   top    → card_top_self.pug，位于作者卡下方（文章页也显示）
#   bottom → card_bottom_self.pug，仅首页/归档等页面显示
#
# 支持字段：
#   class_name  额外 class（写样式时用）
#   id_name     元素 id
#   name        卡片标题
#   icon        标题左侧图标（Font Awesome）
#   order       排序（可选，数字越大越靠后）
#   html        卡片正文，支持纯 HTML
# ============================================================================

top:
  # ---- 正在循环：滚动歌词卡 ----------------------------------------------
  # 内容由 source/js/custom.js 从 source/js/lyrics-data.js 渲染（自动滚动 +
  # 随机切歌）。下面这段 HTML 只是「浏览器禁用 JS」时的兜底显示。
  # 换歌、改歌词请编辑 source/js/lyrics-data.js，不要改这里。
  - class_name: card-lyrics
    id_name: card-lyrics
    name: 正在循环
    icon: fas fa-music
    html: |
      <div class="lyrics" id="lyrics-root">
        <div class="lyrics-viewport">
          <div class="lyrics-track">
            <p class="lyric-line is-active">在我的怀里 在你的眼里</p>
            <p class="lyric-line">那里春风沉醉 那里绿草如茵</p>
            <p class="lyric-line">月光把爱恋 洒满了湖面</p>
          </div>
        </div>
        <div class="lyrics-foot">
          <a class="lyrics-source" href="https://music.163.com/#/song?id=109998" target="_blank" rel="noopener">
            <i class="fas fa-headphones"></i> 贝加尔湖畔 · 李健
          </a>
        </div>
      </div>
