    这几天把 <https://pwn.college/intro-to-cybersecurity/binary-exploitation/> 做完了。学会了基础的 Overflow 和 处理 PIE 和 NOP Sleds 和 Null-free shellcode，对 GDB 的使用和 exp.py 的写更熟练了。下一步是什么呢…
    <https://pwn.college/program-security/program-security/>
    此外发现之前一直跳过的 pwn.college 上的视频，看了一下其实讲的挺好的。

    ?!`0x67616c662f`!?
    突然意识到自己可以用这种神秘的 hex 来作为密码（口令）…
